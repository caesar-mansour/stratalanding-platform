version: 2
updates:
  # npm dependencies — weekly grouped PRs so a CVE fix never sits unnoticed.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  # Keep the CI actions themselves patched.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
